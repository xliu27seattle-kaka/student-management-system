name: Verify assignment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./mvnw -B -ntp verify
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run typecheck:e2e
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the container stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify the frontend and seeded database through Nginx
        run: |
          curl --fail --silent --show-error http://localhost:4200/ --output /dev/null
          curl --fail --silent --show-error 'http://localhost:4200/api/courses?size=1' | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["totalElements"] == 10; assert data["content"][0]["capacity"] == 20'
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the CI containers and test data
        if: always()
        run: docker compose down -v
