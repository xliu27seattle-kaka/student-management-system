services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - student-data:/app/data
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  student-data:
